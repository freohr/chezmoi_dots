####################
### KEYBINDINGSS ###
####################

# Documentation
# https://wiki.hyprland.org/Configuring/Keywords/
# https://wiki.hyprland.org/Configuring/Binds/

## CONFIG VARIABLES

$mainMod = SUPER # Sets "Windows" key as main modifier

# Set programs that you use
$terminal = kitty 
$fileManager = dolphin 
$menu = /home/stephen/.local/bin/rofi-custom
$windowSwitcher = /home/stephen/.local/bin/rofi-windows
$pdf = QT_QPA_PLATFORM=xcb okular

# Hyprland own config directory
$config = /home/stephen/.config/hypr/

## GENERAL HYPRLAND MANAGEMENT
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, F4, exec, shutdown now
bind = $mainMod SHIFT, F4, exec, shutdown -r now

## SOFTWARE LAUNCHERS
bind = $mainMod, space, exec, $menu
bind = ALT, Tab, exec, $windowSwitcher
bind = $mainMod, COMMA, exec, /home/stephen/.local/bin/rofi-emoji

# Various software launchers 
bind = $mainMod, return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, exec, $pdf
bind = $mainMod SHIFT, C, exec, kcalc

# Lock screen
bind = $mainMod SHIFT, L, exec, hyprlock

# Screenshots
bind = , PRINT, exec, hyprshot -m output -m active -z -o "$HYPRSHOT_DIR/$(hyprctl activewindow | rg "\s+class" | sed -r "s/[[:space:]]+class\: //g")"
bind = $mainMod, PRINT, exec, hyprshot -m window -z
bind = $mainMod SHIFT, P, exec, hyprshot -m region -\

## WINDOW MANAGEMENT

bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod SHIFT, J, togglesplit, # dwindle
bind = $mainMod, G, exec, $terminal -e $config/switch-refresh.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, up, movewindow, u
bind = $mainMod, down, movewindow, d

## WORKSPACE MANAGEMENT SUBMAP

# Scroll through existing workspaces
# with mainMod + scroll
bind = $mainMod, mouse_down, workspace, m-1
bind = $mainMod, mouse_up, workspace, m+1

# with keyboard
bind = $mainMod, bracketleft, workspace, m-1
bind = $mainMod, bracketright, workspace, m+1
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, S, workspace, steam
bind = $mainMod CTRL, Y, workspace, youtube

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Switch monitors
bind = $mainMod, F1, movecurrentworkspacetomonitor, DP-1
bind = $mainMod, F2, movecurrentworkspacetomonitor, DP-2

# Get fresh workspace
bind = $mainMod, N, workspace, emptym
bind = $mainMod SHIFT, N, movetoworkspace, emptym
bind = $mainMod ALT, N, movetoworkspacesilent, emptym

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod ALT, S, movetoworkspacesilent, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

## MISC

# Sound management
bindel=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindl =, XF86AudioPlay, exec, playerctl play-pause
bindl =, XF86AudioPrev, exec, playerctl -i kdeconnect previous
bindl =, XF86AudioNext, exec, playerctl -i kdeconnect next

# Window debugging
bind = $mainMod, D, exec, wl-copy "$(hyprctl activewindow)"


