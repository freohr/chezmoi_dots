##############################
###        WINDOWS         ###
##############################

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Startup setup
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
windowrulev2 = workspace 10 silent, initialTitle:Steam
windowrulev2 = workspace 9 silent, initialClass:vesktop

# Auto firefox setup
windowrulev2 = workspace youtube,class:firefox,title:^Youtube 

# Move games to dedicated spaces
windowrulev2 = maximize,class:^steam_app

windowrulev2 = tile, class:pobfrontend

# windowrulev2 = monitor DP-2, content:game
# windowrulev2 = workspace emptym+1, content:game

windowrulev2 = tile, initialClass:^drivethrurpg
windowrulev2 = workspace emptym+1, initialClass:^drivethrurpg

windowrulev2 = noanim, tag:game
windowrulev2 = monitor DP-2, tag:game
windowrulev2 = workspace emptym+1, tag:game

windowrulev2 = tag +game, class:factorio
windowrulev2 = maximize, class:factorio
windowrulev2 = tag +game, class:Hollow Knight Silksong
windowrulev2 = maximize, class:Hollow Knight Silksong
# windowrulev2 = tag +game, class:Dwarf Fortress
# windowrulev2 = maximize, class:Dwarf Fortress
windowrulev2 = tag +game, initialClass:steam_app_230410 # warframe
windowrulev2 = tag +game, initialClass:^steam_app_
windowrulev2 = tag +game, initialTitle:Soulframe
windowrulev2 = maximize, initialTitle:Soulframe
windowrulev2 = tag +game, initialTitle: World of Warcraft
windowrulev2 = maximize, initialTitle: World of Warcraft

# Path of Exile + Awakened PoE Trade
windowrulev2 = tag +poe, title:(Path of Exile)
windowrulev2 = tag +poe, class:(steam_app_238960)
windowrulev2 = fullscreen, tag:poe
windowrulev2 = monitor DP-2, tag:poe
windowrulev2 = workspace emptym+1, tag: poe

windowrulev2 = tag +apt, title:(Awakened PoE Trade)
windowrulev2 = float, tag:apt 
windowrulev2 = noblur, tag:apt
windowrulev2 = nofocus, tag:apt # Disable auto-focus
windowrulev2 = noshadow, tag:apt
windowrulev2 = noborder, tag:apt
windowrulev2 = pin, tag:apt
windowrulev2 = renderunfocused, tag:apt
windowrulev2 = size 100% 100%, tag:apt
windowrulev2 = center, tag:apt

# Misc pop-ups
windowrulev2 = float, tag:popup
windowrulev2 = center, tag:popup

windowrulev2 = tag +popup,class:^rofi
windowrulev2 = noanim,class:^rofi
windowrulev2 = tag +popup, title:Color Picker
windowrulev2 = stayfocused, title:Color Picker

windowrulev2 = tag +popup, title:Diablo II
windowrulev2 = suppressevent activate activatefocus, title:Diablo II
windowrulev2 = monitor DP-2, title:Diablo II

windowrulev2 = tag +popup, class:^xdg-desktop-portal-gtk
windowrulev2 = tag +popup, class:^org.freedesktop.impl.portal.desktop.kde
windowrulev2 = tag +popup, class:org.kde.kcalc
windowrulev2 = tag +popup, class:Bitwarden
windowrulev2 = tag +popup, class:zenity
windowrulev2 = tag +popup, class:org.inkscape.Inkscape, title:^[^-]+$
windowrulev2 = tag +popup, class:Vampire Survivors
windowrulev2 = tag +popup, initialClass:naps2, initialTitle:^DCP-1510 \(brother4)
windowrulev2 = tag +popup, class:qimgv, title:^Edit shortcut
windowrulev2 = tag +popup, class:AppImageLauncher
