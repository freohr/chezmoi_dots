background {
    monitor =
    # path = $HOME/Pictures/Wallpaper/gasmask.png  # only png supported for now
    color = rgba(1D2021)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor = DP-2
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1.00 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(FBF1C7)
    inner_color = rgb(282828)
    font_color = rgb(db4740)
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}

# Current time
label {
    monitor = DP-2
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = rgb(e2cca9)
    font_size = 64
    font_family = Iosevka Aile 10
    position = 0, 20
    halign = center
    valign = center
}
label {
    monitor = DP-2
    text = cmd[update:1000] echo "<b><big> $(date +"%A %d %B") </big></b>"
    color = rgb(e2cca9)
    font_size = 16
    font_family = Iosevka Aile 10
    position = 0, -60
    halign = center
    valign = center
}



